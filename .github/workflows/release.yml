name: release

# Attach the packed package to the GitHub release for a version tag. Consumers
# pin the asset URL and its integrity hash, so the asset must come from CI, built
# from the tagged commit. Cut a release with a `chore: release brand contract X.Y.Z`
# commit that bumps package.json, then a signed tag: git tag -s vX.Y.Z && git push origin vX.Y.Z
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - run: npm ci
      - run: npm run check

      - name: Verify the tag matches the package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"

      - name: Pack
        run: npm pack --pack-destination "$RUNNER_TEMP/pack"

      - name: Publish the release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/pack/*.tgz --verify-tag --generate-notes
